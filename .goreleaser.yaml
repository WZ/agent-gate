# goreleaser config — see https://goreleaser.com
# Pure-Go build (CGO_ENABLED=0). One archive per GOOS/GOARCH.
# Triggered by tag push via .github/workflows/release.yml.
version: 2

project_name: agent-gate

before:
  hooks:
    - go mod tidy

builds:
  - id: agent-gate
    main: ./cmd/agent-gate
    binary: agent-gate
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows ARM64 is rare in agent-gate's audience; re-enable when asked.
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      # End-user release artifact: ship the binary + LICENSE only. README,
      # CLAUDE.md, and TODOS.md are repo-level docs that live on GitHub.
      # Bundling them in every platform tarball just inflates the archive
      # and ships internal roadmap text in user downloads.
      - LICENSE*

brews:
  - name: agent-gate
    # Auto-pushes a Ruby formula to WZ/homebrew-tap on every stable v* tag.
    # Users install via:
    #   brew tap WZ/tap
    #   brew install agent-gate
    # The tap repo + a HOMEBREW_TAP_TOKEN secret with write access to it
    # are required (see .github/workflows/release.yml). If the token is
    # missing, the release fails loud rather than silently skipping —
    # that's intentional, since a partial release without the brew bump
    # would surprise users on `brew upgrade`.
    repository:
      owner: WZ
      name: homebrew-tap
      branch: main
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
    homepage: https://github.com/WZ/agent-gate
    description: Single-user audit gate for AI agent HTTPS traffic
    license: Apache-2.0
    # `auto` skips on pre-release tags (anything goreleaser flags as
    # prerelease via the SemVer pattern, e.g. v0.4.0-rc1). Stable tags
    # bump the formula.
    skip_upload: auto
    install: |
      bin.install "agent-gate"
    test: |
      system "#{bin}/agent-gate", "version"

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^merge'
      - 'Merge pull request'
      - 'Merge branch'

release:
  github:
    owner: WZ
    name: agent-gate
  draft: false
  # Tags follow vX.Y.Z. `auto` still marks semver prerelease tags correctly
  # if we ever push one.
  prerelease: auto
  name_template: 'agent-gate {{ .Tag }}'
  header: |
    ## agent-gate {{ .Tag }}

    Single-user audit gate for AI agent HTTPS traffic. See the
    [README](https://github.com/WZ/agent-gate/blob/main/README.md) for
    what this is and how to get started.

    ### Install

    **macOS — Homebrew:**

    ```
    brew tap WZ/tap
    brew install agent-gate
    ```

    **Other platforms — binary download:** grab the archive for your
    platform below, extract, and put `agent-gate` on your `PATH`. On
    macOS without Homebrew, you may need to clear the quarantine
    attribute the first time:

    ```
    xattr -d com.apple.quarantine ./agent-gate
    ```

    Either way, finish with:

    ```
    agent-gate init
    ```
  footer: |
    **Full Changelog:** https://github.com/WZ/agent-gate/compare/{{ .PreviousTag }}...{{ .Tag }}
