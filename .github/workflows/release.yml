name: release

# Triggered by pushing a vX.Y.Z tag. Builds binaries for darwin/linux/windows
# via goreleaser and uploads them to a GitHub Release.
#
# Security notes:
# - This workflow does NOT consume any user-controlled inputs (issue titles,
#   PR bodies, commit messages, head_ref, etc.). The only template
#   expansions are `secrets.GITHUB_TOKEN` (GitHub-issued, bounded by the
#   permissions block above) and `secrets.HOMEBREW_TAP_TOKEN` (a
#   maintainer-issued PAT scoped to the tap repo).
# - All actions are pinned by major version; goreleaser is pinned to v2.
# - `fetch-depth: 0` is required for goreleaser to walk the git history for
#   the changelog generation.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run tests before release
        run: go test ./...

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Homebrew formula auto-publish to WZ/homebrew-tap. Required by
          # the `brews:` block in .goreleaser.yaml. Cross-repo write needs
          # a dedicated PAT — GITHUB_TOKEN is scoped to this repo only.
          # Generate a fine-grained PAT with Contents: read+write on the
          # tap repo and store as HOMEBREW_TAP_TOKEN secret.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
