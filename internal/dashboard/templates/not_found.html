{{ define "not_found" }}

  <div class="page-heading">
    <div>
      <p class="eyebrow">404</p>
      <h2>{{ .Title }}</h2>
    </div>
  </div>

  <section class="panel">
    <div class="empty-state">
      <strong>{{ .Message }}</strong>

        <a href="/" class="row-action">Back to Operations</a>
        &nbsp;·&nbsp;
        <a href="/explore" class="row-action">Open Explore</a>
      </p>
    </div>
  </section>
</section>
{{ end }}
