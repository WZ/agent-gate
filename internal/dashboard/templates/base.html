{{ define "base" }}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>agent-gate</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
  <script src="/static/htmx-sse.js"></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="shell-header">
    <div class="shell-brand">
      <p class="eyebrow">Local traffic audit</p>
      <h1>agent-gate</h1>
    </div>
    <nav class="top-nav" aria-label="Primary">
      <a href="/" class="top-nav-link{{ if eq .ActiveRoute "operations" }} active{{ end }}">Operations</a>
      <a href="/explore" class="top-nav-link{{ if eq .ActiveRoute "explore" }} active{{ end }}">Explore</a>
    </nav>
    <div class="live-pill"><span aria-hidden="true"></span> capture live</div>
  </header>
  <main class="shell-main">
    {{ .Content }}
  </main>
</body>
</html>
{{ end }}
